<!DOCTYPE html>
<html lang="ru">
  @@include('../modules/head.html', { "links" : ["./css/page.css"] })
  <body>
    <div class="wrapper">
      @@include('../modules/header.html') @@include('../modules/preloader.html')

      <main class="main"></main>

        <div class="reservation-form__inputs">
          <label class="reservation-form__box date-min">
            <input type="text" id="date-min" class="reservation-form__input" />

            <div class="reservation-form__box-content">
              <div class="reservation-form__info">
                <span class="reservation-form__icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                  >
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M17.5 4H6.5V2H5.5V4H1V22H23V4H18.5V2H17.5V4ZM5.5 7V5H2V9H22V5H18.5V7H17.5V5H6.5V7H5.5ZM2 10V21H22V10H2Z"
                      fill="#8C8C8C"
                    />
                  </svg>
                </span>
                <span class="reservation-form__text">Дата заезда</span>
              </div>

              <span class="reservation-form__arrow">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="8"
                  viewBox="0 0 14 8"
                  fill="none"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M13.7383 1.44238L13.5673 1.5329C10.998 2.8931 8.89695 4.99419 7.53675 7.56345L7.44623 7.73443L6.56244 7.73443L6.47192 7.56345C5.11172 4.99419 3.01064 2.8931 0.441373 1.5329L0.270393 1.44238L0.738281 0.558593L0.909261 0.649112C3.44334 1.99068 5.55136 4.00649 7.00434 6.46755C8.45731 4.00649 10.5653 1.99069 13.0994 0.649112L13.2704 0.558594L13.7383 1.44238Z"
                    fill="#039191"
                  />
                </svg>
              </span>
            </div>
          </label>

          <label class="reservation-form__box date-max">
            <input type="text" id="date-max" class="reservation-form__input" />

            <div class="reservation-form__box-content">
              <div class="reservation-form__info">
                <span class="reservation-form__icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                  >
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M17.5 4H6.5V2H5.5V4H1V22H23V4H18.5V2H17.5V4ZM5.5 7V5H2V9H22V5H18.5V7H17.5V5H6.5V7H5.5ZM2 10V21H22V10H2Z"
                      fill="#8C8C8C"
                    />
                  </svg>
                </span>
                <span class="reservation-form__text">Дата выезда</span>
              </div>

              <span class="reservation-form__arrow">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="8"
                  viewBox="0 0 14 8"
                  fill="none"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M13.7383 1.44238L13.5673 1.5329C10.998 2.8931 8.89695 4.99419 7.53675 7.56345L7.44623 7.73443L6.56244 7.73443L6.47192 7.56345C5.11172 4.99419 3.01064 2.8931 0.441373 1.5329L0.270393 1.44238L0.738281 0.558593L0.909261 0.649112C3.44334 1.99068 5.55136 4.00649 7.00434 6.46755C8.45731 4.00649 10.5653 1.99069 13.0994 0.649112L13.2704 0.558594L13.7383 1.44238Z"
                    fill="#039191"
                  />
                </svg>
              </span>
            </div>
          </label>

          <label class="reservation-form__box">
            <input type="date" class="reservation-form__input" />

            <div class="reservation-form__box-content">
              <div class="reservation-form__info">
                <span class="reservation-form__icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"

                      fill="#8C8C8C"
                    />
                  </svg>
                </span>
                <span class="reservation-form__text">Кол-во гостей</span>
              </div>

              <span class="reservation-form__arrow">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="8"
                  viewBox="0 0 14 8"
                  fill="none"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M13.7383 1.44238L13.5673 1.5329C10.998 2.8931 8.89695 4.99419 7.53675 7.56345L7.44623 7.73443L6.56244 7.73443L6.47192 7.56345C5.11172 4.99419 3.01064 2.8931 0.441373 1.5329L0.270393 1.44238L0.738281 0.558593L0.909261 0.649112C3.44334 1.99068 5.55136 4.00649 7.00434 6.46755C8.45731 4.00649 10.5653 1.99069 13.0994 0.649112L13.2704 0.558594L13.7383 1.44238Z"
                    fill="#039191"
                  />
                </svg>
              </span>
            </div>
          </label>
        </div>

        <button class="reservation-form__btn button button--green">
          Найти номера
        </button>
      </form>

      @@include('../modules/gebotModal.html')
      @@include('../modules/successModal.html')
      @@include('../modules/footer.html')
    </div>

    <script src="./js/lib/imask.min.js"></script>
    <script src="./js/lib/air-datepicker.js"></script>
    <script src="./js/page.js" type="module"></script>
  </body>
</html>
